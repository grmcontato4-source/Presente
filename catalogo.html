<!-- VISUALIZADOR DE FOTOS -->
<div id="visualizador" class="visualizador">

    <span id="fechar-foto">&times;</span>

    <img id="foto-ampliada" src="" alt="Foto ampliada">

</div>

<script>

const galeria = document.querySelector(".grid-galeria");

const visualizador = document.getElementById("visualizador");

const fotoAmpliada = document.getElementById("foto-ampliada");

const fecharFoto = document.getElementById("fechar-foto");

// AMPLIAR FOTO
galeria.addEventListener("click", function(event) {

    if (event.target.classList.contains("foto-galeria")) {

        fotoAmpliada.src = event.target.src;

        visualizador.style.display = "flex";

    }

});

// FECHAR NO X
fecharFoto.addEventListener("click", function() {

    visualizador.style.display = "none";

});

// FECHAR CLICANDO FORA DA FOTO
visualizador.addEventListener("click", function(event) {

    if (event.target === visualizador) {

        visualizador.style.display = "none";

    }

});

// FECHAR COM ESC
document.addEventListener("keydown", function(event) {

    if (event.key === "Escape") {

        visualizador.style.display = "none";

    }

});

</script>
